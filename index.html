<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3dCapture</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            /* Плавный многоступенчатый градиент как на образце: синий сверху, зеленоватый переход посередине и желтый снизу */
            background: linear-gradient(to bottom, #0099ff 0%, #0099ff 25%, #4bb385 50%, #ffd700 75%, #ffd700 100%);
            background-attachment: fixed;
            font-family: sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-wrapper {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        #menu-toggle-btn {
            background: rgba(5, 8, 17, 0.85);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #menu-toggle-btn:hover {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 15px rgba(0,255,255,0.6);
        }
        #ui {
            margin-top: 10px;
            color: #ffffff;
            font-size: 13px;
            text-shadow: 0 0 8px rgba(0,255,255,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(5, 8, 17, 0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            width: 280px;
            max-height: 75vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        #ui.collapsed {
            display: none;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        button.action-btn {
            background: rgba(0, 240, 255, 0.2);
            border: 1px solid #00f0ff;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        button.action-btn:hover {
            background: rgba(0, 240, 255, 0.5);
        }
        button.action-btn:disabled {
            background: rgba(255, 255, 255, 0.05);
            border-color: #555555;
            color: #777777;
            cursor: not-allowed;
        }
        .slider-control {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            color: #00f0ff;
        }
        .checkbox-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00f0ff;
            cursor: pointer;
        }
        .color-picker-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #00f0ff;
        }
        .color-picker-control input[type="color"] {
            border: 1px solid #00f0ff;
            background: transparent;
            width: 32px;
            height: 24px;
            cursor: pointer;
            border-radius: 4px;
            padding: 0;
        }
        input[type=range] {
            accent-color: #00f0ff;
            cursor: pointer;
        }
        input[type=checkbox] {
            accent-color: #00f0ff;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .help-text {
            font-size: 11px;
            color: #88c0d0;
            border-bottom: 1px solid rgba(0,240,255,0.2);
            padding-bottom: 6px;
        }
    </style>
</head>
<body>
    <div id="ui-wrapper">
        <button id="menu-toggle-btn">⚙️ Меню настроек</button>
        <div id="ui" class="collapsed">
            <div class="help-text">ЛКМ + Драг: Протянуть лозу<br>Клик по сфере: Emoji<br>ПКМ: Вращение | Колесико: Масштаб</div>

            <label class="checkbox-control">
                <input type="checkbox" id="emoji-toggle" checked>
                <span>😃 Отображать смайлики</span>
            </label>

            <label class="checkbox-control">
                <input type="checkbox" id="ai-player-toggle">
                <span>🤖 Компьютер играет за игрока</span>
            </label>

            <div class="color-picker-control">
                <span>🎨 Верх (Синий):</span>
                <input type="color" id="bg-color-1" value="#0099ff">
            </div>

            <div class="color-picker-control">
                <span>🎨 Низ (Желтый):</span>
                <input type="color" id="bg-color-2" value="#ffd700">
            </div>

            <div class="slider-control">
                <div class="slider-label"><span>🛡️ Живучесть сфер:</span><span id="vitality-val">4.5</span></div>
                <input type="range" id="vitality-slider" min="2.0" max="8.0" step="0.5" value="4.5">
            </div>

            <div class="slider-control">
                <div class="slider-label"><span>〰️ Синусоидальность лозы:</span><span id="spiral-val">1.0</span></div>
                <input type="range" id="spiral-slider" min="0" max="3.0" step="0.1" value="1.0">
            </div>

            <div class="slider-control">
                <div class="slider-label"><span>🎲 Рандомность лозы:</span><span id="randomness-val">1.0</span></div>
                <input type="range" id="randomness-slider" min="0.1" max="3.0" step="0.1" value="1.0">
            </div>

            <div class="slider-control">
                <div class="slider-label"><span>🌫️ Плотность тумана:</span><span id="fog-val">1.2</span></div>
                <input type="range" id="fog-slider" min="0" max="3" step="0.1" value="1.2">
            </div>

            <div class="slider-control">
                <div class="slider-label"><span>📍 Дистанция спавна:</span><span id="spawn-dist-val">15</span></div>
                <input type="range" id="spawn-dist-slider" min="5" max="500" step="5" value="15">
            </div>

            <div class="slider-control">
                <div class="slider-label"><span>🌱 Скорость роста:</span><span id="growth-val">0.003</span></div>
                <input type="range" id="growth-slider" min="0.0005" max="0.015" step="0.0005" value="0.003">
            </div>

            <div class="slider-control">
                <div class="slider-label"><span>⚡ Скорость лозы:</span><span id="speed-val">0.005</span></div>
                <input type="range" id="speed-slider" min="0.001" max="0.02" step="0.001" value="0.005">
            </div>

            <div class="btn-group">
                <button class="action-btn" id="spawn-random-btn">🎲 Создать сферу</button>
                <button class="action-btn" id="respawn-btn">🔄 Возродиться</button>
            </div>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@14.0.2/dist/twemoji.min.js"></script>

    <script>
        const COLORS = {
            PLAYER: 0x00f0ff,
            NEUTRAL: 0x888888,
            ENEMY1: 0xff2a5f,
            ENEMY2: 0x00ff66,
            ENEMY3: 0xffaa00
        };

        const EMOJI_SETS = {
            PLAYER: ['😎', '🚀', '⚡', '🤖', '👑', '🔥'],
            NEUTRAL: ['😐', '⚪', '💤', '📦', '🗿', '💎'],
            ENEMY1: ['😈', '🔥', '💀', '👹', '👾', '💥'],
            ENEMY2: ['👽', '☣️', '🧪', '🛸', '🦎', '🦠'],
            ENEMY3: ['🤡', '💥', '💣', '🎃', '👺', '👁️']
        };

        let globalBuildSpeed = 0.005;
        let globalGrowthRate = 0.003;
        let globalFogMult = 1.2;
        let globalSpawnDistance = 15;
        let globalMaxRadius = 4.5;
        let globalSpiralMult = 1.0;
        let globalVineRandomness = 1.0;
        let aiPlayForPlayer = false;
        let showEmojis = true;
        const BASE_MAX_VISION = 500;

        let scene, camera, renderer, controls;
        let nodes = [];
        let connections = [];
        let selectedNode = null;
        let dragLine = null;

        let pointerDownTime = 0;
        let pointerDownPos = { x: 0, y: 0 };

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const drawPlane = new THREE.Plane();

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            updateBackgroundColors('#0099ff', '#ffd700');

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.set(0, 0, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.mouseButtons = {
                LEFT: THREE.MOUSE.NONE,
                MIDDLE: THREE.MOUSE.DOLLY,
                RIGHT: THREE.MOUSE.ROTATE
            };

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 30);
            scene.add(dirLight);

            createInitialNodes();

            const previewPoints = generateRandomSpiralPoints(new THREE.Vector3(), new THREE.Vector3(1,1,0), 50);
            const geom = new THREE.BufferGeometry().setFromPoints(previewPoints);
            const mat = new THREE.LineBasicMaterial({ color: COLORS.PLAYER, linewidth: 2, transparent: true, opacity: 0.8 });
            dragLine = new THREE.Line(geom, mat);
            dragLine.visible = false;
            scene.add(dragLine);

            setupUIListeners();

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);
            renderer.domElement.addEventListener('pointerup', onPointerUp);

            document.getElementById('spawn-random-btn').addEventListener('click', () => {
                spawnNodeInView(null);
            });

            document.getElementById('respawn-btn').addEventListener('click', () => {
                spawnNodeInView('PLAYER');
                checkPlayerStatus();
            });

            setInterval(aiTick, 1200);
            setInterval(checkPlayerStatus, 300);
        }

        function hexToRgb(hex) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => {
                const hex = Math.round(x).toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('');
        }

        function updateBackgroundColors(color1, color2) {
            // Вычисляем промежуточный зелено-бирюзовый оттенок для точного соответствия вашему примеру перехода
            const c1 = hexToRgb(color1);
            const c2 = hexToRgb(color2);
            const midR = (c1.r * 0.35 + c2.r * 0.65);
            const midG = (c1.g * 0.35 + c2.g * 0.65);
            const midB = (c1.b * 0.35 + c2.b * 0.65);
            const midColor = rgbToHex(midR, midG, midB);

            // Создаем многоступенчатый градиент с широкой полосой плавного смешивания в центре
            document.body.style.background = `linear-gradient(to bottom, ${color1} 0%, ${color1} 25%, ${midColor} 50%, ${color2} 75%, ${color2} 100%)`;
            scene.background = new THREE.Color(color1);
            scene.fog = new THREE.FogExp2(color1, 0.025);
        }

        function setupUIListeners() {
            const menuToggleBtn = document.getElementById('menu-toggle-btn');
            const uiPanel = document.getElementById('ui');

            menuToggleBtn.addEventListener('click', () => {
                uiPanel.classList.toggle('collapsed');
                menuToggleBtn.innerText = uiPanel.classList.contains('collapsed') ? '⚙️ Меню настроек' : '✖ Закрыть меню';
            });

            const emojiToggle = document.getElementById('emoji-toggle');
            emojiToggle.addEventListener('change', (e) => {
                showEmojis = e.target.checked;
                nodes.forEach(node => {
                    if (node.sprite) {
                        node.sprite.visible = showEmojis;
                    }
                });
            });

            const aiToggle = document.getElementById('ai-player-toggle');
            aiToggle.addEventListener('change', (e) => {
                aiPlayForPlayer = e.target.checked;
            });

            const bgColor1 = document.getElementById('bg-color-1');
            const bgColor2 = document.getElementById('bg-color-2');
            
            const handleBgChange = () => {
                updateBackgroundColors(bgColor1.value, bgColor2.value);
            };
            bgColor1.addEventListener('input', handleBgChange);
            bgColor2.addEventListener('input', handleBgChange);

            const spiralSlider = document.getElementById('spiral-slider');
            spiralSlider.addEventListener('input', (e) => {
                globalSpiralMult = parseFloat(e.target.value);
                document.getElementById('spiral-val').innerText = globalSpiralMult;
            });

            const randomnessSlider = document.getElementById('randomness-slider');
            randomnessSlider.addEventListener('input', (e) => {
                globalVineRandomness = parseFloat(e.target.value);
                document.getElementById('randomness-val').innerText = globalVineRandomness;
            });

            const vitalitySlider = document.getElementById('vitality-slider');
            vitalitySlider.addEventListener('input', (e) => {
                globalMaxRadius = parseFloat(e.target.value);
                document.getElementById('vitality-val').innerText = globalMaxRadius;
                nodes.forEach(node => {
                    node.maxRadius = globalMaxRadius;
                    if (node.radius > node.maxRadius) {
                        node.radius = node.maxRadius;
                        node.mesh.scale.setScalar(node.radius);
                    }
                });
            });

            const fogSlider = document.getElementById('fog-slider');
            fogSlider.addEventListener('input', (e) => {
                globalFogMult = parseFloat(e.target.value);
                document.getElementById('fog-val').innerText = globalFogMult;
            });

            const spawnSlider = document.getElementById('spawn-dist-slider');
            spawnSlider.addEventListener('input', (e) => {
                globalSpawnDistance = parseFloat(e.target.value);
                document.getElementById('spawn-dist-val').innerText = globalSpawnDistance;
            });

            const growthSlider = document.getElementById('growth-slider');
            growthSlider.addEventListener('input', (e) => {
                globalGrowthRate = parseFloat(e.target.value);
                document.getElementById('growth-val').innerText = globalGrowthRate;
            });

            const speedSlider = document.getElementById('speed-slider');
            speedSlider.addEventListener('input', (e) => {
                globalBuildSpeed = parseFloat(e.target.value);
                document.getElementById('speed-val').innerText = globalBuildSpeed;
            });
        }

        function checkPlayerStatus() {
            const playerNodes = nodes.filter(n => n.owner === 'PLAYER');
            const respawnBtn = document.getElementById('respawn-btn');
            if (playerNodes.length === 0) {
                respawnBtn.disabled = false;
                respawnBtn.innerText = "🔄 Возродиться";
            } else {
                respawnBtn.disabled = true;
                respawnBtn.innerText = "🔄 Игрок жив";
            }
        }

        function createEmojiTexture(emojiChar, callback) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            const drawFallback = () => {
                ctx.clearRect(0, 0, 128, 128);
                ctx.font = '75px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(emojiChar, 64, 64);
                callback(new THREE.CanvasTexture(canvas));
            };

            try {
                const parsedHtml = twemoji.parse(emojiChar, { folder: 'svg', ext: '.svg' });
                const srcMatch = parsedHtml.match(/src="([^"]+)"/);

                if (srcMatch && srcMatch[1]) {
                    const img = new Image();
                    img.crossOrigin = 'Anonymous';
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, 128, 128);
                        callback(new THREE.CanvasTexture(canvas));
                    };
                    img.onerror = drawFallback;
                    img.src = srcMatch[1];
                } else {
                    drawFallback();
                }
            } catch (e) {
                drawFallback();
            }
        }

        function generateRandomSpiralPoints(from, to, segments = 100) {
            const points = [];
            const dir = new THREE.Vector3().subVectors(to, from);
            const len = dir.length();
            if (len === 0) return [from.clone()];

            const normalDir = dir.clone().normalize();
            let up = new THREE.Vector3(0, 1, 0);
            if (Math.abs(normalDir.dot(up)) > 0.9) up.set(1, 0, 0);
            const side = new THREE.Vector3().crossVectors(normalDir, up).normalize();
            const orthoUp = new THREE.Vector3().crossVectors(side, normalDir).normalize();

            const baseAmplitude = Math.min(len * 0.15, 6.0) * globalSpiralMult;

            const numCoils = 6;
            const coilParams = [];
            for (let i = 0; i < numCoils; i++) {
                coilParams.push({
                    freqShift: (0.8 + Math.random() * 0.6) * globalVineRandomness,
                    ampNoise: (0.6 + Math.random() * 0.8) * globalVineRandomness,
                    phase: Math.random() * Math.PI * 2
                });
            }

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const basePos = new THREE.Vector3().lerpVectors(from, to, t);

                const currentCoilIndex = Math.min(Math.floor(t * numCoils), numCoils - 1);
                const params = coilParams[currentCoilIndex];

                const baseAngle = t * Math.PI * 2 * numCoils;
                const r = Math.sin(t * Math.PI) * baseAmplitude * params.ampNoise * Math.sin(baseAngle * params.freqShift + params.phase);

                const offsetX = side.clone().multiplyScalar(Math.cos(baseAngle) * r);
                const offsetY = orthoUp.clone().multiplyScalar(Math.sin(baseAngle) * r);

                basePos.add(offsetX).add(offsetY);
                points.push(basePos);
            }
            return points;
        }

        function createNode(x, y, z, owner, radius) {
            const geom = new THREE.SphereGeometry(1, 32, 32);
            const mat = new THREE.MeshPhongMaterial({
                color: COLORS[owner],
                emissive: COLORS[owner],
                emissiveIntensity: 0.2,
                transparent: true,
                opacity: 0.65,
                shininess: 90
            });

            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(x, y, z);

            const emojiList = EMOJI_SETS[owner];
            const currentEmoji = emojiList[Math.floor(Math.random() * emojiList.length)];

            const spriteMat = new THREE.SpriteMaterial({ transparent: true, opacity: 1 });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.visible = showEmojis;
            
            const spriteScale = radius * 1.5;
            sprite.scale.set(spriteScale, spriteScale, spriteScale);
            mesh.add(sprite);

            createEmojiTexture(currentEmoji, (texture) => {
                sprite.material.map = texture;
                sprite.material.needsUpdate = true;
            });

            const auraGeom = new THREE.SphereGeometry(1, 16, 16);
            const auraMat = new THREE.MeshBasicMaterial({
                color: COLORS[owner],
                wireframe: true,
                transparent: true,
                opacity: 0.2
            });
            const aura = new THREE.Mesh(auraGeom, auraMat);
            aura.scale.setScalar(1.15);
            mesh.add(aura);

            scene.add(mesh);

            const node = {
                id: nodes.length,
                mesh: mesh,
                aura: aura,
                sprite: sprite,
                owner: owner,
                radius: radius,
                maxRadius: globalMaxRadius,
                minRadius: 1.0
            };

            node.mesh.scale.setScalar(node.radius);
            nodes.push(node);
            return node;
        }

        function spawnNodeInView(forcedTeam = null) {
            let spawnPos = new THREE.Vector3();

            if (nodes.length > 0) {
                const baseNode = nodes[Math.floor(Math.random() * nodes.length)];
                const offset = new THREE.Vector3(
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2
                ).normalize().multiplyScalar(globalSpawnDistance);
                
                spawnPos.copy(baseNode.mesh.position).add(offset);
            } else {
                const currentDist = camera.position.distanceTo(controls.target);
                const distance = Math.min(currentDist, BASE_MAX_VISION * 1.5);
                const vFOV = THREE.MathUtils.degToRad(camera.fov);
                const visibleHeight = 2 * Math.tan(vFOV / 2) * distance;
                const visibleWidth = visibleHeight * camera.aspect;

                const offsetX = (Math.random() - 0.5) * visibleWidth * 0.7;
                const offsetY = (Math.random() - 0.5) * visibleHeight * 0.7;
                const offsetZ = (Math.random() - 0.5) * (distance * 0.3);

                spawnPos.set(offsetX, offsetY, -distance + offsetZ);
                spawnPos.applyMatrix4(camera.matrixWorld);
            }

            const teams = ['NEUTRAL', 'ENEMY1', 'ENEMY2', 'ENEMY3'];
            const randomTeam = forcedTeam || teams[Math.floor(Math.random() * teams.length)];
            const scaledRadius = 1.8 + Math.random() * 1.2;

            return createNode(spawnPos.x, spawnPos.y, spawnPos.z, randomTeam, scaledRadius);
        }

        function createInitialNodes() {
            const positions = [
                { x: -15, y: -8, z: 0, owner: 'PLAYER', radius: 2.2 },
                { x: 15, y: 8, z: 0, owner: 'ENEMY1', radius: 2.2 },
                { x: -15, y: 8, z: -5, owner: 'ENEMY2', radius: 2.2 },
                { x: 15, y: -8, z: 5, owner: 'ENEMY3', radius: 2.2 },
                { x: 0, y: 0, z: 0, owner: 'NEUTRAL', radius: 2.8 }
            ];

            positions.forEach(p => createNode(p.x, p.y, p.z, p.owner, p.radius));
        }

        function createVineTube(fromPos, toPos, color) {
            const spiralPoints = generateRandomSpiralPoints(fromPos, toPos, 120);
            const curve = new THREE.CatmullRomCurve3(spiralPoints);

            const geom = new THREE.TubeGeometry(curve, 100, 0.15, 8, false);
            geom.setDrawRange(0, 0);

            const mat = new THREE.MeshPhongMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.3,
                shininess: 50
            });

            const tube = new THREE.Mesh(geom, mat);
            scene.add(tube);

            return {
                mesh: tube,
                curve: curve,
                totalIndices: geom.index.count,
                progress: 0,
                isFullyBuilt: false
            };
        }

        function getIntersectionPoint(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const target = new THREE.Vector3();
            raycaster.ray.intersectPlane(drawPlane, target);
            return target;
        }

        function onPointerDown(e) {
            if (e.button !== 0) return;

            pointerDownTime = Date.now();
            pointerDownPos = { x: e.clientX, y: e.clientY };

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(nodes.map(n => n.mesh));

            if (intersects.length > 0) {
                const hitNode = nodes.find(n => n.mesh === intersects[0].object);
                if (hitNode && hitNode.owner === 'PLAYER') {
                    selectedNode = hitNode;
                    drawPlane.setFromNormalAndCoplanarPoint(
                        camera.getWorldDirection(new THREE.Vector3()).negate(),
                        selectedNode.mesh.position
                    );
                    dragLine.visible = true;
                }
            }
        }

        function onPointerMove(e) {
            if (!selectedNode) return;
            const worldPos = getIntersectionPoint(e);
            const start = selectedNode.mesh.position;
            const points = generateRandomSpiralPoints(start, worldPos, 60);

            dragLine.geometry.dispose();
            dragLine.geometry = new THREE.BufferGeometry().setFromPoints(points);
        }

        function onPointerUp(e) {
            if (e.button !== 0) return;

            const clickDuration = Date.now() - pointerDownTime;
            const distMoved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);

            if (clickDuration < 250 && distMoved < 5) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);

                const intersects = raycaster.intersectObjects(nodes.map(n => n.mesh));
                if (intersects.length > 0) {
                    const hitNode = nodes.find(n => n.mesh === intersects[0].object);
                    if (hitNode) {
                        onNodeClickInteract(hitNode);
                    }
                }
            }

            if (selectedNode) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);

                const intersects = raycaster.intersectObjects(nodes.map(n => n.mesh));
                if (intersects.length > 0) {
                    const targetNode = nodes.find(n => n.mesh === intersects[0].object);
                    if (targetNode && targetNode !== selectedNode) {
                        addConnection(selectedNode, targetNode);
                    }
                }
            }

            selectedNode = null;
            dragLine.visible = false;
        }

        function onNodeClickInteract(node) {
            const emojiList = EMOJI_SETS[node.owner];
            const nextEmoji = emojiList[Math.floor(Math.random() * emojiList.length)];

            node.radius = Math.min(node.maxRadius, node.radius + 0.4);
            node.mesh.scale.setScalar(node.radius);

            createEmojiTexture(nextEmoji, (texture) => {
                node.sprite.material.map = texture;
                node.sprite.material.needsUpdate = true;
            });
        }

        function addConnection(fromNode, toNode) {
            const existingIndex = connections.findIndex(c => c.from === fromNode && c.to === toNode);
            if (existingIndex !== -1) return;

            const vineData = createVineTube(fromNode.mesh.position, toNode.mesh.position, COLORS[fromNode.owner]);
            connections.push({
                from: fromNode,
                to: toNode,
                mesh: vineData.mesh,
                totalIndices: vineData.totalIndices,
                progress: 0,
                isFullyBuilt: false
            });
        }

        function aiTick() {
            const teams = ['ENEMY1', 'ENEMY2', 'ENEMY3'];
            if (aiPlayForPlayer) {
                teams.push('PLAYER');
            }

            teams.forEach(team => {
                const myNodes = nodes.filter(n => n.owner === team);

                if (myNodes.length === 0) {
                    if (team === 'PLAYER' && aiPlayForPlayer) {
                        spawnNodeInView('PLAYER');
                    } else if (Math.random() < 0.35) {
                        spawnNodeInView(team);
                    }
                    return;
                }

                if (Math.random() < 0.3 && myNodes.length < 8) {
                    const choice = Math.random();
                    if (choice < 0.5) {
                        spawnNodeInView(team === 'PLAYER' ? 'PLAYER' : null);
                    } else {
                        const parent = myNodes[Math.floor(Math.random() * myNodes.length)];
                        if (parent.radius > 2.0) {
                            const newNode = spawnNodeInView(team);
                            addConnection(parent, newNode);
                            return;
                        }
                    }
                }

                const source = myNodes[Math.floor(Math.random() * myNodes.length)];
                if (source.radius < 1.5) return;

                const currentCamDist = camera.position.distanceTo(controls.target);
                const maxRange = Math.max(BASE_MAX_VISION, currentCamDist * 1.2);

                const targets = nodes.filter(n => {
                    const isEnemy = n.owner !== team;
                    const isWithinView = n.mesh.position.distanceTo(camera.position) <= maxRange;
                    return isEnemy && isWithinView;
                });

                if (targets.length === 0) return;

                targets.sort((a, b) => 
                    source.mesh.position.distanceTo(a.mesh.position) - 
                    source.mesh.position.distanceTo(b.mesh.position)
                );

                addConnection(source, targets[0]);
            });
        }

        function triggerNodeDestruction(node, newOwner) {
            let opacityVal = 1.0;
            const emojiList = EMOJI_SETS[newOwner];
            const nextEmoji = emojiList[Math.floor(Math.random() * emojiList.length)];

            const animInterval = setInterval(() => {
                opacityVal -= 0.15;
                node.sprite.material.opacity = Math.max(0, opacityVal);

                if (opacityVal <= 0) {
                    clearInterval(animInterval);
                    node.owner = newOwner;
                    updateNodeAppearance(node);

                    createEmojiTexture(nextEmoji, (texture) => {
                        node.sprite.material.map = texture;
                        node.sprite.material.needsUpdate = true;
                        
                        let fadeIn = 0;
                        const fadeInInterval = setInterval(() => {
                            fadeIn += 0.15;
                            node.sprite.material.opacity = Math.min(1, fadeIn);
                            if (fadeIn >= 1) clearInterval(fadeInInterval);
                        }, 30);
                    });
                }
            }, 30);
        }

        function updateNodeAppearance(node) {
            node.mesh.material.color.setHex(COLORS[node.owner]);
            node.mesh.material.emissive.setHex(COLORS[node.owner]);
            node.aura.material.color.setHex(COLORS[node.owner]);
        }

        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            const camDist = camera.position.distanceTo(controls.target);
            if (globalFogMult > 0) {
                scene.fog.density = (globalFogMult) / Math.max(camDist, 15);
            } else {
                scene.fog.density = 0.0001;
            }

            nodes.forEach(node => {
                if (node.owner !== 'NEUTRAL' && node.radius < node.maxRadius) {
                    node.radius += globalGrowthRate;
                    node.mesh.scale.setScalar(node.radius);
                }

                const currentScale = node.radius * 1.5;
                node.sprite.scale.set(currentScale, currentScale, currentScale);

                node.aura.rotation.y += 0.01;
                node.aura.rotation.x += 0.005;
            });

            for (let i = connections.length - 1; i >= 0; i--) {
                const conn = connections[i];

                if (!conn.isFullyBuilt) {
                    conn.progress += globalBuildSpeed;
                    const drawCount = Math.floor(conn.progress * conn.totalIndices);
                    conn.mesh.geometry.setDrawRange(0, drawCount);

                    if (conn.progress >= 1.0) {
                        conn.isFullyBuilt = true;
                        conn.mesh.geometry.setDrawRange(0, conn.totalIndices);
                    }
                    continue;
                }

                const transferAmount = 0.008;

                if (conn.from.radius > conn.from.minRadius + transferAmount) {
                    conn.from.radius -= transferAmount;
                    conn.from.mesh.scale.setScalar(conn.from.radius);

                    if (conn.from.owner === conn.to.owner) {
                        if (conn.to.radius < conn.to.maxRadius) {
                            conn.to.radius += transferAmount;
                        }
                    } else {
                        conn.to.radius -= transferAmount * 1.2;

                        if (conn.to.radius <= conn.to.minRadius) {
                            triggerNodeDestruction(conn.to, conn.from.owner);
                            conn.to.radius = conn.to.minRadius + 0.2;

                            connections = connections.filter(c => {
                                if (c.from === conn.to) {
                                    scene.remove(c.mesh);
                                    return false;
                                }
                                return true;
                            });
                        }
                    }
                    conn.to.mesh.scale.setScalar(conn.to.radius);
                } else {
                    scene.remove(conn.mesh);
                    connections.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
